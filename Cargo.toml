[workspace]
resolver = "2"
members = [
    "crates/tsdb-types",
    "crates/tsdb-core",
    "crates/tsdb-query",
    "crates/tsdb-index",
    "crates/tsdb-compress",
    "crates/tsdb-aggregate",
    "crates/tsdb-server",
    "crates/tsdb-cli",
    "crates/tsdb-plugin",
    "crates/tsdb-config",
    "crates/tsdb-chart",
    "crates/tsdb-dashboard",
    "crates/tsdb-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tsdb-types = { path = "crates/tsdb-types" }
tsdb-core = { path = "crates/tsdb-core" }
tsdb-query = { path = "crates/tsdb-query" }
tsdb-index = { path = "crates/tsdb-index" }
tsdb-compress = { path = "crates/tsdb-compress" }
tsdb-aggregate = { path = "crates/tsdb-aggregate" }
tsdb-server = { path = "crates/tsdb-server" }
tsdb-plugin = { path = "crates/tsdb-plugin" }
tsdb-config = { path = "crates/tsdb-config" }
tsdb-chart = { path = "crates/tsdb-chart" }
tsdb-dashboard = { path = "crates/tsdb-dashboard" }

rocksdb = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
chrono = "0.4"
rust-ini = "0.21"
crc32fast = "1"
roaring = "0.10"
sqlparser = "0.53"
nng = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
warp = "0.3"
